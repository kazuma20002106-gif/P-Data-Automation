name: P-Data Daily Scraper

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch: # 手動実行ボタン

# 権限を最強レベルに設定（403エラー対策）
permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright playwright-stealth
        playwright install --with-deps chromium
        
    - name: Run Scraper
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" python p_test.py
      
    # 失敗しても成功しても、撮影したスクリーンショットを「Artifact」として保存する（原因究明用）
    - name: Upload Debug Screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-screenshots
        path: debug_screen.png

    - name: Commit and Push Data (Keepalive)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sudo timedatectl set-timezone Asia/Tokyo
        date > last_run.txt 
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add master_data.csv last_run.txt || true
        if ! git diff --cached --exit-code --quiet; then
          git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push origin main
        else
          echo "No changes to commit"
        fi